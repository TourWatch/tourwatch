name: Check tour availability

on:
  workflow_dispatch:
  schedule:
    # Proof-of-concept only. GitHub may delay scheduled jobs during busy periods.
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TourWatch
        run: python monitor.py
