name: Check tour availability

on:
  workflow_dispatch:
    inputs:
    search_term:
        description: 'Search Recreation.gov attractions'
        required: false
        type: string
        default: 'Mammoth Cave'
      test_email:
        description: 'Send a test email even if nothing new opened'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test RIDB discovery
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          SEARCH_TERM: ${{ inputs.search_term }}
        run: python discover.py
      - name: Run TourWatch
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TOURWATCH_TEST_EMAIL: ${{ inputs.test_email }}
        run: python monitor.py
      - name: Save availability baseline
        run: |
          if git diff --quiet -- state.json && git ls-files --error-unmatch state.json >/dev/null 2>&1; then
            echo 'No state change.'
            exit 0
          fi
          git config user.name 'TourWatch Bot'
          git config user.email 'tourwatch-bot@users.noreply.github.com'
          git add state.json
          git commit -m 'Update TourWatch availability state' || true
          git push
